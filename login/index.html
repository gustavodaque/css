<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
     
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Times New Roman', Times, serif;
       } 

           body{
            height: 100vh;
            background-color: liner-gradient (135deg, #6c63ff, #48c6ef);
            display: flex;
            align-items: center;
            justify-content: center;
           }
          .login-container{
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.8);
          }
          .login-container h2{
            margin-bottom: 20px;
            color: #333;
          }

          .login-container input{
            width: 100%;
            padding: 10px 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
          }

          .login-container button{
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s; 
          }
          .login-container button:hover{
            background: #5848c2;
          }

          .login-container p{
            margin-top: 15px;
            font-size: 12px;
            color: #666;
          }

    </style>
</head>

<body>
    <!-- < ! -- Container da tela de login -- > -->
    <div class="login-container">
        <h2>Login</h2>
        <form>
            <input type="text" placeholder="Usuário" required>
            <input type="password" placeholder="Senha" required>
            <button type="submit">Entre</button>
        </form>
        <p>Esqueceu a senha?</p>
    </div>


</body>

</html>
